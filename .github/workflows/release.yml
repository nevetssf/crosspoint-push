name: Release

# Publishes the version in manifest.json as a release with main.js and manifest.json.
# Trigger: Actions tab → Release → Run workflow, or push a tag matching that version.
on:
  workflow_dispatch:
  push:
    tags: ["*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Resolve version
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $VERSION"; exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$VERSION" main.js manifest.json \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes "Download \`main.js\` and \`manifest.json\` into \`<vault>/.obsidian/plugins/crosspoint-push/\`, then enable **CrossPoint Push** in Community plugins. See the README for usage."
